<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Manutenção — CTOSM/SMS Cuiabá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<style>
:root{
  --paper:#EEF1EC;
  --panel:#FFFFFF;
  --ink:#1B2430;
  --ink-soft:#5B6774;
  --navy:#1B5E3C;
  --navy-2:#24714A;
  --line:#D7DCD4;
  --amber:#B8722C;
  --amber-soft:#F3E2CB;
  --green:#2F9E64;
  --green-soft:#DCEBE1;
  --red:#B23A34;
  --red-soft:#F5DCDA;
  --blue:#3B6E91;
  --blue-soft:#DCE7EE;
  --grid: 24px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: var(--grid) var(--grid);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.45;
}
h1,h2,h3,.brand,.nav-item,.tab-title{font-family:'Archivo',sans-serif;}
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0;
  background:var(--navy);
  color:#E7ECEF;
  padding:22px 16px;
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:22px;
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:4px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.brand{font-size:15px; font-weight:700; letter-spacing:.2px; line-height:1.3;}
.brand small{display:block; font-weight:400; font-size:11px; color:#9FB0BE; margin-top:4px; font-family:'Inter',sans-serif;}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
.nav-item{
  background:rgba(255,255,255,.04); border:none; text-align:left; color:#C6D1DA;
  padding:10px 10px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600;
  display:flex; align-items:center; gap:9px;
  box-shadow: 0 1px 0 rgba(255,255,255,.10) inset, 0 1px 2px rgba(0,0,0,.28);
  transition: transform .08s ease, box-shadow .08s ease;
}
.nav-item:hover{background:rgba(255,255,255,.09); box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 2px 4px rgba(0,0,0,.32);}
.nav-item:active{transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,.3) inset;}
.nav-item.active{background:var(--navy-2); color:#fff; box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 2px 5px rgba(0,0,0,.35);}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#5C7284;flex-shrink:0;}
.nav-item.active .nav-dot{background:var(--amber);}
.sidebar-foot{margin-top:auto; font-size:11px; color:#7D8FA0; border-top:1px solid rgba(255,255,255,.1); padding-top:12px;}
.main{flex:1; padding:28px 34px; max-width:1180px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
.tab-title{font-size:22px; font-weight:700; color:var(--navy); margin:0;}
.tab-sub{color:var(--ink-soft); font-size:13px; margin-top:3px;}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:20px; margin-bottom:18px;
}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.panel-head h3{margin:0; font-size:14.5px; color:var(--navy); font-weight:700;}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; border-left:4px solid var(--navy);}
.stat.st-green{border-left-color:var(--green);}
.stat.st-red{border-left-color:var(--red);}
.stat.st-amber{border-left-color:var(--amber);}
.stat .num{font-family:'Archivo',sans-serif; font-size:26px; font-weight:800; color:var(--navy);}
.stat .lab{font-size:12px; color:var(--ink-soft); margin-top:2px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:8px 10px; color:var(--ink-soft); font-weight:600;
  border-bottom:2px solid var(--line); font-size:11.5px;
}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.badge{
  display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;
}
.b-feito{background:var(--green-soft); color:var(--green);}
.b-nfeito{background:var(--red-soft); color:var(--red);}
.b-parcial{background:var(--blue-soft); color:var(--blue);}
.b-pendente{background:var(--amber-soft); color:var(--amber);}
select, input[type=text], input[type=month], input[type=date], textarea{
  font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border:1px solid var(--line);
  border-radius:6px; background:#fff; color:var(--ink); width:100%;
}
textarea{resize:vertical; min-height:54px;}
label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
.field{margin-bottom:12px;}
.row{display:grid; gap:12px;}
.row-2{grid-template-columns:1fr 1fr;}
.row-3{grid-template-columns:1fr 1fr 1fr;}
.row-4{grid-template-columns:1.4fr 1fr 1fr 1fr;}
button{
  font-family:'Inter',sans-serif; font-weight:700; font-size:13px; border:none; border-radius:6px;
  padding:9px 16px; cursor:pointer; background:var(--navy); color:#fff;
}
button:hover{background:var(--navy-2);}
button.secondary{background:#fff; border:1px solid var(--line); color:var(--ink);}
button.secondary:hover{background:#F4F6F3;}
button.danger{background:var(--red-soft); color:var(--red);}
button.danger:hover{background:#EFC7C4;}
button.ghost{background:none; color:var(--ink-soft); padding:4px 8px;}
.icon-btn{padding:5px 9px; font-size:12px;}
.empty{
  text-align:center; padding:36px 20px; color:var(--ink-soft);
  border:1.5px dashed var(--line); border-radius:8px; font-size:13px;
}
.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.pill{
  padding:6px 13px; border-radius:20px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.month-picker{display:flex; align-items:center; gap:10px;}
.month-picker button{padding:6px 11px;}
.month-picker .cur{font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; color:var(--navy); min-width:150px; text-align:center; text-transform:capitalize;}
.modal-bg{
  position:fixed; inset:0; background:rgba(21,42,62,.45); display:none;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal-bg.open{display:flex;}
.modal{background:#fff; border-radius:10px; padding:24px; width:100%; max-width:460px; max-height:88vh; overflow:auto;}
.modal h3{margin:0 0 16px; color:var(--navy); font-size:16px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.note-box{background:var(--amber-soft); border:1px solid #E4C398; border-radius:6px; padding:12px 14px; font-size:12.5px; color:#7A4E1E; margin-bottom:16px;}
.small-text{font-size:11.5px; color:var(--ink-soft);}
.unit-tag{font-size:11.5px; color:var(--ink-soft);}
.b-amber{background:var(--amber-soft); color:var(--amber);}

/* ---- Documento CI ---- */
.ci-doc{
  background:#fff; border:1px solid var(--line); border-radius:4px;
  padding:36px 40px; font-family:'Inter',Arial,sans-serif; color:#111;
  max-width:820px;
}
.ci-header{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--navy); padding-bottom:14px; margin-bottom:14px;}
.ci-brasao{
  width:52px; height:52px; border-radius:50%; background:var(--navy); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
  flex-shrink:0; font-family:'Archivo',sans-serif;
}
.ci-header-text{flex:1;}
.ci-orgao{font-weight:800; font-size:14px; color:var(--navy); font-family:'Archivo',sans-serif;}
.ci-secretaria{font-size:12.5px; margin-top:2px;}
.ci-coord{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.ci-num{text-align:right; font-size:11.5px; flex-shrink:0;}
.ci-num-label{font-weight:700; letter-spacing:.3px; color:var(--navy);}
.ci-num-value{margin-top:3px;}
.ci-meta{font-size:12.5px; margin-bottom:16px; display:flex; flex-direction:column; gap:4px;}
.ci-resumo{display:flex; gap:22px; margin-bottom:22px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.ci-resumo div{display:flex; flex-direction:column; font-size:11px; color:var(--ink-soft);}
.ci-resumo strong{font-family:'Archivo',sans-serif; font-size:18px; color:var(--navy);}
.ci-equipe{margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line);}
.ci-equipe:last-of-type{border-bottom:none;}
.ci-equipe h4{margin:0 0 8px; font-size:13.5px; color:var(--navy); font-family:'Archivo',sans-serif;}
.ci-integrantes{font-weight:400; font-size:11.5px; color:var(--ink-soft);}
.ci-sub{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 6px; text-transform:none;}
.ci-empty{font-size:12px; color:var(--ink-soft); font-style:italic; margin:0 0 6px;}
.ci-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:6px;}
.ci-table th{background:#F4F6F3; text-align:left; padding:5px 8px; border:1px solid var(--line); font-size:10.5px;}
.ci-table td{padding:5px 8px; border:1px solid var(--line);}
.ci-obs{font-size:11.5px; margin:6px 0;}
.ci-assinatura{font-size:11px; color:var(--ink-soft); margin-top:8px;}
.ci-legenda{margin-top:16px; padding-top:10px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-soft);}
.ci-rodape{margin-top:26px; font-size:10.5px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:flex-end; gap:20px;}
.ci-assinatura-final{text-align:center; font-size:11.5px; color:var(--ink);}
@media print{
  body{background:#fff;}
  .sidebar, .topbar{display:none !important;}
  .main{padding:0; max-width:none;}
  .ci-doc{border:none; padding:0; max-width:none;}
}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-grid-head{margin-bottom:6px;}
.cal-cell{min-height:64px; border:1px solid var(--line); border-radius:6px; padding:6px; cursor:pointer; background:#fff;}
.cal-cell.cal-head{min-height:auto; border:none; text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); cursor:default; background:none;}
.cal-cell.cal-empty{border:none; background:none; cursor:default;}
.cal-cell:hover{border-color:var(--navy);}
.cal-cell.cal-hoje{border-color:var(--amber); border-width:2px;}
.cal-cell.cal-selecionado{background:var(--blue-soft);}
.cal-daynum{font-size:12px; font-weight:700; color:var(--ink);}
.cal-badges{display:flex; gap:3px; align-items:center; margin-top:4px; flex-wrap:wrap;}
.cal-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
@media(max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
  .nav{flex-direction:row;}
  .sidebar-foot{display:none;}
  .main{padding:18px;}
  .row-2,.row-3,.row-4{grid-template-columns:1fr;}
}
</style>
</head>

const CS_SUPABASE_URL = "https://cqopgqmsjwfczhbiishj.supabase.co";
const CS_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxb3BncW1zandmY3poYmlpc2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDM5MzAsImV4cCI6MjEwNDIxOTkzMH0.O3HuqHax9u2ZEdW4gpodbfPxWU05Sujg94L2SicfmbI";
let csClient = null;
let CS_REGISTROS = [];   // espelho local dos registros do Controle de Serviços (nunca gravamos de volta)
let CS_FOTOS_COUNT = {}; // registro_id -> quantidade de fotos
let csConectado = false;
let csUltimaAtualizacao = null;

function csCategoriaParaTipoServico(cat){
  const map = {
    hidraulica: "Hidráulica",
    eletrica: "Elétrica",
    pedreiro_civil: "Alvenaria / Civil",
    pintura: "Pintura",
    serralheria: "Serralheria / Esquadrias",
    limpeza: "Limpeza de áreas externas",
    ar_condicionado: "Ar-condicionado / Climatização",
    outros: "Outros"
  };
  return map[cat] || "Outros";
}
function csRegistroAberto(r){
  return r.status !== "finalizado" && r.status !== "recusado";
}
async function initSupabaseSync(){
  if(typeof supabase === "undefined"){ console.warn("Biblioteca do Supabase não carregou."); return; }
  csClient = supabase.createClient(CS_SUPABASE_URL, CS_SUPABASE_ANON_KEY);
  await loadData();
  startPmRealtime();
  startCsSync();
}
async function startCsSync(){
  try{
    await csFetchAll();
    csClient
      .channel("cs-sync")
      .on("postgres_changes", {event:"*", schema:"public", table:"cs_registros"}, payload=>{
        csFetchAll();
      })
      .on("postgres_changes", {event:"*", schema:"public", table:"cs_fotos"}, payload=>{
        csFetchFotosCount();
        if(activeTab==="cs_live" || activeTab==="painel" || activeTab==="backlog" || activeTab==="mapa") render();
      })
      .subscribe(status=>{
        csConectado = (status === "SUBSCRIBED");
        if(activeTab==="cs_live") render();
      });
  }catch(e){
    console.error("Falha ao conectar ao Controle de Serviços:", e);
  }
}
async function csFetchAll(){
  if(!csClient) return;
  const { data, error } = await csClient.from("cs_registros").select("*").order("data_solicitacao", {ascending:false});
  if(error){ console.error("Erro ao ler cs_registros:", error); return; }
  CS_REGISTROS = data || [];
  csUltimaAtualizacao = new Date();
  await csFetchFotosCount();
  if(["cs_live","painel","backlog","mapa"].includes(activeTab)) render();
}
const CS_STORAGE_BUCKET = "servicos-manutencao";
function csFotoUrl(storagePath){
  return `${CS_SUPABASE_URL}/storage/v1/object/public/${CS_STORAGE_BUCKET}/${storagePath}`;
}
let CS_FOTOS_POR_REGISTRO = {}; // registro_id -> [{id, url, caption, tipo}]
async function csFetchFotosCount(){
  if(!csClient) return;
  const { data, error } = await csClient.from("cs_fotos").select("id, registro_id, storage_path, caption, tipo, ordem").order("ordem", {ascending:true});
  if(error){ console.error("Erro ao ler cs_fotos:", error); return; }
  const counts = {};
  const porRegistro = {};
  (data||[]).forEach(f=>{
    counts[f.registro_id] = (counts[f.registro_id]||0)+1;
    if(!porRegistro[f.registro_id]) porRegistro[f.registro_id] = [];
    porRegistro[f.registro_id].push({id:f.id, url:csFotoUrl(f.storage_path), caption:f.caption||"", tipo:f.tipo||""});
  });
  CS_FOTOS_COUNT = counts;
  CS_FOTOS_POR_REGISTRO = porRegistro;
}
/* itens abertos do Controle de Serviços, no mesmo formato usado pelo backlog/planejamento */
function csItensAbertos(){
  return CS_REGISTROS.filter(csRegistroAberto).map(r=>{
    const tipoServico = csCategoriaParaTipoServico((r.categorias&&r.categorias[0])||"outros");
    const equipeAuto = equipePorTipo(tipoServico);
    const atribuidaId = DATA.csAtribuicoes[r.id];
    const equipeId = atribuidaId ? atribuidaId : (equipeAuto ? equipeAuto.id : null);
    return {
      tipo: "SGD (Controle de Serviços)",
      registroId: r.id,
      unidadeNomeRaw: r.local || "(sem unidade informada)",
      tipoServico,
      descricao: (r.solicitacao||r.descricao||"").slice(0,140),
      prioridade: r.prioridade || "P3",
      equipeId,
      atribuidaManualmente: !!atribuidaId,
      status: "Pendente",
      criadoEm: r.data_solicitacao ? new Date(r.data_solicitacao).toISOString() : null,
      vencido: isVencido(r.data_solicitacao ? new Date(r.data_solicitacao).toISOString() : null, r.prioridade||"P3", "Pendente", null),
      sgd: r.sgd, lat: r.lat, lng: r.lng, fotos: CS_FOTOS_COUNT[r.id]||0,
      dataAgendada: DATA.csAgendamentos[r.id]||null
    };
  });
}
function csItensFinalizadosNoMes(mesAno){
  return CS_REGISTROS.filter(r=>r.status==="finalizado" && r.data_execucao && r.data_execucao.startsWith(mesAno)).map(r=>{
    const tipoServico = csCategoriaParaTipoServico((r.categorias&&r.categorias[0])||"outros");
    const equipeAuto = equipePorTipo(tipoServico);
    const atribuidaId = DATA.csAtribuicoes[r.id];
    const equipeId = atribuidaId ? atribuidaId : (equipeAuto ? equipeAuto.id : null);
    return {
      tipo: "SGD (Controle de Serviços)",
      registroId: r.id,
      unidadeNomeRaw: r.local || "(sem unidade informada)",
      tipoServico,
      descricao: (r.solicitacao||r.descricao||"").slice(0,140),
      prioridade: r.prioridade || "P3",
      equipeId,
      atribuidaManualmente: !!atribuidaId,
      status: "Feito",
      criadoEm: r.data_solicitacao ? new Date(r.data_solicitacao).toISOString() : null,
      dataExecucao: r.data_execucao,
      vencido: false,
      sgd: r.sgd, lat: r.lat, lng: r.lng, fotos: CS_FOTOS_COUNT[r.id]||0
    };
  });
}
function setCsEquipe(registroId, equipeId){
  if(equipeId){ DATA.csAtribuicoes[registroId] = equipeId; }
  else{ delete DATA.csAtribuicoes[registroId]; }
  saveData();
  render();
}

const PM_TABLE = "pm_estado";
let pmLastSavedAt = null; // usado pra não reagir ao eco da própria gravação
async function loadData(){
  try{
    const { data, error } = await csClient.from(PM_TABLE).select("dados, atualizado_em").eq("id","default").single();
    if(error) throw error;
    if(data && data.dados && Object.keys(data.dados).length){
      DATA = Object.assign(DATA, data.dados);
      pmLastSavedAt = data.atualizado_em;
    }
  }catch(e){
    console.error("Falha ao carregar o Plano de Manutenção do Supabase — usando estado local padrão.", e);
  }
  if(!DATA.unidades || DATA.unidades.length===0){
    DATA.unidades = UNIDADES_COORD_SEED.map(u=>({
      id: uid(), nome: u.name, regional: u.regional||"", lat: u.lat, lng: u.lng,
      endereco: u.endereco||"", rede: u.rede||""
    }));
    saveData();
  }
  render();
}
function startPmRealtime(){
  csClient
    .channel("pm-sync")
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:PM_TABLE, filter:"id=eq.default"}, payload=>{
      if(payload.new.atualizado_em === pmLastSavedAt) return; // eco da nossa própria gravação
      DATA = Object.assign(DATA, payload.new.dados);
      pmLastSavedAt = payload.new.atualizado_em;
      render();
    })
    .subscribe();
}
let saveDataTimer = null;
async function saveData(){
  clearTimeout(saveDataTimer);
  saveDataTimer = setTimeout(async ()=>{
    if(!csClient) return;
    try{
      const nowIso = new Date().toISOString();
      pmLastSavedAt = nowIso;
      const { error } = await csClient.from(PM_TABLE).update({dados: DATA, atualizado_em: nowIso}).eq("id","default");
      if(error) console.error("Falha ao salvar o Plano de Manutenção no Supabase:", error);
    }catch(e){
      console.error("Falha ao salvar o Plano de Manutenção no Supabase:", e);
    }
  }, 400);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function resizeImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob=>resolve(blob), "image/jpeg", 0.72);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const PERIODOS = {
  "Mensal":1, "Bimestral":2, "Trimestral":3, "Semestral":6, "Anual":12
};
const PRIORIDADES = {
  "P1": {label:"P1 — Emergencial", slaHoras:4, cor:"var(--red)"},
  "P2": {label:"P2 — Alta", slaHoras:24, cor:"var(--amber)"},
  "P3": {label:"P3 — Normal", slaHoras:120, cor:"var(--blue)"},
  "P4": {label:"P4 — Programável", slaHoras:null, cor:"var(--ink-soft)"}
};
const MOTIVOS_NAO_FEITO = [
  "Falta de material","Falta de equipe","Falta de acesso à unidade","Unidade fechada",
  "Serviço de maior complexidade","Necessita contratação","Necessita equipamento",
  "Condição climática","Reprogramação da gestão","Outros"
];
const SLA_POR_PERFIL = {
  A: {P1:4, P2:24, P3:240, P4:1440},
  B: {P1:8, P2:24, P3:240, P4:1440},
  C: {P1:24, P2:72, P3:360, P4:2160},
  D: {P1:24, P2:72, P3:360, P4:2160},
  E: {P1:24, P2:72, P3:360, P4:2160},
  F: {P1:48, P2:120, P3:480, P4:2160},
  G: {P1:48, P2:120, P3:480, P4:2160}
};
function perfilLetra(unidadeId){
  const u = DATA.unidades.find(x=>x.id===unidadeId);
  if(!u || !u.perfil) return null;
  return u.perfil.trim().charAt(0);
}
function slaHoras(prioridade, unidadeId){
  const letra = unidadeId ? perfilLetra(unidadeId) : null;
  if(letra && SLA_POR_PERFIL[letra] && SLA_POR_PERFIL[letra][prioridade]!=null) return SLA_POR_PERFIL[letra][prioridade];
  return PRIORIDADES[prioridade] ? PRIORIDADES[prioridade].slaHoras : null;
}
function prazoLimite(criadoEm, prioridade, unidadeId){
  const sla = slaHoras(prioridade, unidadeId);
  if(!sla || !criadoEm) return null;
  const d = new Date(criadoEm);
  d.setHours(d.getHours() + sla);
  return d;
}
function isVencido(criadoEm, prioridade, status, unidadeId){
  if(status === "Feito") return false;
  const limite = prazoLimite(criadoEm, prioridade, unidadeId);
  if(!limite) return false;
  return new Date() > limite;
}
function prioridadeBadge(p){
  const info = PRIORIDADES[p] || PRIORIDADES.P4;
  return `<span class="badge" style="background:${info.cor}22; color:${info.cor};">${p||"P4"}</span>`;
}
function monthsBetween(a,b){
  const [ay,am]=a.split("-").map(Number), [by,bm]=b.split("-").map(Number);
  return (by-ay)*12 + (bm-am);
}
function isDueInMonth(item, mesAno){
  const diff = monthsBetween(item.mesInicio, mesAno);
  if(diff<0) return false;
  const step = PERIODOS[item.periodicidade] || 1;
  return diff % step === 0;
}
function fmtMes(mesAno){
  const [y,m]=mesAno.split("-").map(Number);
  const nomes=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return nomes[m-1]+" de "+y;
}
function curMesAno(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function addMonths(mesAno, n){
  let [y,m]=mesAno.split("-").map(Number);
  m+=n;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+"-"+String(m).padStart(2,"0");
}

/* ---------------- BACKLOG ---------------- */
function backlogItens(){
  const itens = [];
  const mesAtual = curMesAno();
  DATA.planoItens.filter(it=>isDueInMonth(it, mesAtual)).forEach(it=>{
    const c = getCiclo(it.id, mesAtual);
    const status = c ? c.status : "Pendente";
    if(status !== "Feito"){
      const prioridade = it.prioridade||"P4";
      itens.push({tipo:"Plano recorrente", unidadeId:it.unidadeId, tipoServico:it.tipoServico, descricao:it.observacao||"", prioridade, equipeId:equipeDoItem(it), status, criadoEm:it.criadoEm, vencido:isVencido(it.criadoEm, prioridade, status, it.unidadeId)});
    }
  });
  DATA.demandas.filter(d=>d.status!=="Feito").forEach(d=>{
    const prioridade = d.prioridade||"P2";
    itens.push({tipo: d.origem==="Vistoria"?"Vistoria":d.origem==="Chamado"?"Chamado":d.origem==="Planejamento"?"Planejamento":"Demanda avulsa", unidadeId:d.unidadeId, tipoServico:d.tipoServico, descricao:d.descricao, prioridade, equipeId:d.equipeId, status:d.status, criadoEm:d.criadoEm, vencido:isVencido(d.criadoEm, prioridade, d.status, d.unidadeId), demandaId:d.id, dataAgendada:d.dataAgendada||null});
  });
  itens.push(...csItensAbertos());
  return itens;
}
function taxaRetrabalho(){
  const total = DATA.ciclos.length;
  const reaberturas = DATA.ciclos.filter(c=>c.status==="Não feito").length;
  return {total, reaberturas, taxa: total ? Math.round(reaberturas/total*100) : 0};
}

function metaDe(sigla, campo){
  const m = METAS_INDICADORES.find(x=>x.sigla===sigla);
  if(!m) return "—";
  const v = m[campo];
  if(typeof v === "number") return Math.round(v*100)+"%";

}
function fmtPct(n, d){
  if(!d) return null;
  return Math.round((n/d)*100);
}
function computeIndicadores(){
  const mesAtual = curMesAno();
  const anoAtual = new Date().getFullYear();
  const unidadesElegiveis = DATA.unidades.filter(u=>!(u.perfil||"").startsWith("G"));

  // IAP — aderência ao programa preventivo (mês atual)
  const dueMes = DATA.planoItens.filter(it=>isDueInMonth(it, mesAtual));
  const feitosMes = dueMes.filter(it=>{ const c=getCiclo(it.id, mesAtual); return c && c.status==="Feito"; }).length;
  const IAP = fmtPct(feitosMes, dueMes.length);

  // ICR — cobertura da rede (ao menos 1 visita feita, em qualquer momento)
  const unidadesComVisita = new Set(DATA.ciclos.filter(c=>c.status==="Feito").map(c=>{
    const it = DATA.planoItens.find(i=>i.id===c.planoItemId); return it?it.unidadeId:null;
  }).filter(Boolean));
  const ICR = fmtPct(unidadesComVisita.size, unidadesElegiveis.length);

  // IRP — rondas em unidades P1/P2 (proxy: ao menos uma execução já registrada)
  const unidadesP1P2 = DATA.unidades.filter(u=>u.classeCriticidade==="P1"||u.classeCriticidade==="P2");
  const p1p2ComVisita = unidadesP1P2.filter(u=>unidadesComVisita.has(u.id)).length;
  const IRP = fmtPct(p1p2ComVisita, unidadesP1P2.length);

  // RPC — relação preventiva/corretiva (mês atual)
  const preventivasMes = DATA.ciclos.filter(c=>c.mesAno===mesAtual).length;
  const corretivasMes = DATA.demandas.filter(d=>d.mesAlvo===mesAtual).length + csItensAbertos().length + csItensFinalizadosNoMes(mesAtual).length;
  const RPC = fmtPct(preventivasMes, preventivasMes+corretivasMes);

  // IJA / IJB — conclusão das janelas sazonais, com data-marco fixa
  const itensJanelaA = DATA.planoItens.filter(it=>(it.janela||"").includes("Janela A"));
  const jaConcluidos = itensJanelaA.filter(it=>DATA.ciclos.some(c=>c.planoItemId===it.id && c.status==="Feito")).length;
  const IJA = fmtPct(jaConcluidos, itensJanelaA.length);
  const prazoJA = new Date(anoAtual,9,31); // 31/10
  const itensJanelaB = DATA.planoItens.filter(it=>(it.janela||"").includes("Janela B"));
  const jbConcluidos = itensJanelaB.filter(it=>DATA.ciclos.some(c=>c.planoItemId===it.id && c.status==="Feito")).length;
  const IJB = fmtPct(jbConcluidos, itensJanelaB.length);
  const prazoJB = new Date(anoAtual,3,30); // 30/04

  // TMA-P1 / TMA-P2 — atendimento dentro do prazo do perfil (só considera já concluídos)
  const todasDemandas = [...DATA.demandas];
  function tmaClasse(classe){
    const doClasse = todasDemandas.filter(d=>(d.prioridade||"")===classe && d.dataExecucao);
    if(doClasse.length===0) return null;
    const dentroPrazo = doClasse.filter(d=>{
      const limite = prazoLimite(d.criadoEm, d.prioridade, d.unidadeId);
      if(!limite) return true;
      return new Date(d.dataExecucao) <= limite;
    }).length;
    return fmtPct(dentroPrazo, doClasse.length);
  }
  const TMAP1 = tmaClasse("P1");
  const TMAP2 = tmaClasse("P2");

  // IRC — reincidência corretiva (2+ demandas do mesmo tipo, mesma unidade, em 90 dias)
  const noventaDias = 90*24*3600*1000;
  const agora = Date.now();
  const recentes = todasDemandas.filter(d=>d.criadoEm && (agora - new Date(d.criadoEm).getTime()) <= noventaDias);
  const porUnidadeTipo = {};
  recentes.forEach(d=>{ const k=d.unidadeId+"|"+d.tipoServico; porUnidadeTipo[k]=(porUnidadeTipo[k]||0)+1; });
  const unidadesAtendidas = new Set(recentes.map(d=>d.unidadeId));
  const unidadesReincidentes = new Set(Object.keys(porUnidadeTipo).filter(k=>porUnidadeTipo[k]>=2).map(k=>k.split("|")[0]));
  const IRC = fmtPct(unidadesReincidentes.size, unidadesAtendidas.size);

  // IRR — reprogramação com justificativa
  const naoFeitos = DATA.ciclos.filter(c=>c.status==="Não feito");
  const comJustificativa = naoFeitos.filter(c=>c.motivo && c.replanejarPara).length;
  const IRR = fmtPct(comJustificativa, naoFeitos.length);

  // ILR — reservatórios em conformidade (rotinas RES-*)
  const itensRes = DATA.planoItens.filter(it=>(it.codigoRotina||"").startsWith("RES"));
  const resFeitos = itensRes.filter(it=>DATA.ciclos.some(c=>c.planoItemId===it.id && c.status==="Feito")).length;
  const ILR = fmtPct(resFeitos, itensRes.length);

  // ICE — conservação externa (área externa ≥ 500 m²)
  const unidadesAreaExterna = DATA.unidades.filter(u=>(u.areaExterna||0)>=500);
  const iceOk = unidadesAreaExterna.filter(u=>DATA.planoItens.some(it=>it.unidadeId===u.id && it.tipoServico==="Limpeza de áreas externas" && DATA.ciclos.some(c=>c.planoItemId===it.id && c.status==="Feito"))).length;
  const ICE = fmtPct(iceOk, unidadesAreaExterna.length);

  // ICL — interface de climatização
  const climatDemandas = todasDemandas.filter(d=>d.tipoServico==="Ar-condicionado / Climatização");
  const climatResolvidas = climatDemandas.filter(d=>d.status==="Feito").length;
  const ICL = fmtPct(climatResolvidas, climatDemandas.length);

  // BLC — backlog corretivo (exclui plano recorrente)
  const BLC = backlogItens().filter(i=>i.tipo!=="Plano recorrente").length;

  return [
    {sigla:"IAP", nome:"Aderência ao programa preventivo", valor:IAP, nota: dueMes.length===0?"Sem itens programados neste mês.":null},
    {sigla:"ICR", nome:"Cobertura da rede", valor:ICR, nota: unidadesElegiveis.length===0?"Sem unidades elegíveis cadastradas.":null},
    {sigla:"IRP", nome:"Rondas em unidades P1 e P2", valor:IRP, nota: unidadesP1P2.length===0?"Nenhuma unidade classificada como P1/P2 ainda — importe a classificação em Unidades.":"Aproximação: considera se já houve alguma execução, não a frequência trimestral completa."},
    {sigla:"RPC", nome:"Relação preventiva/corretiva", valor:RPC, nota: (preventivasMes+corretivasMes)===0?"Sem OS registradas neste mês.":null},
    {sigla:"IJA", nome:"Conclusão da Janela A (até 31/10)", valor:IJA, nota: itensJanelaA.length===0?"Nenhum item do plano está marcado com Janela A ainda — gere pelo Catálogo de Rotinas.":("Prazo: "+prazoJA.toLocaleDateString('pt-BR'))},
    {sigla:"IJB", nome:"Conclusão da Janela B (até 30/04)", valor:IJB, nota: itensJanelaB.length===0?"Nenhum item do plano está marcado com Janela B ainda — gere pelo Catálogo de Rotinas.":("Prazo: "+prazoJB.toLocaleDateString('pt-BR'))},
    {sigla:"TMA-P1", nome:"Emergências atendidas no prazo do perfil", valor:TMAP1, nota: TMAP1===null?"Nenhuma demanda P1 concluída ainda para calcular.":null},
    {sigla:"TMA-P2", nome:"Urgências atendidas no prazo do perfil", valor:TMAP2, nota: TMAP2===null?"Nenhuma demanda P2 concluída ainda para calcular.":null},
    {sigla:"IRC", nome:"Reincidência corretiva (90 dias)", valor:IRC, nota: unidadesAtendidas.size===0?"Sem demandas nos últimos 90 dias.":null, invertido:true},
    {sigla:"IRR", nome:"Reprogramação preventiva com justificativa", valor:IRR, nota: naoFeitos.length===0?"Nenhum item marcado como \"não feito\" ainda.":null},
    {sigla:"ILR", nome:"Reservatórios em conformidade", valor:ILR, nota: itensRes.length===0?"Nenhuma rotina de reservação (RES-*) cadastrada ainda.":null},
    {sigla:"ICE", nome:"Conservação externa (área ≥ 500 m²)", valor:ICE, nota: unidadesAreaExterna.length===0?"Nenhuma unidade com área externa ≥ 500 m² classificada ainda.":null},
    {sigla:"ICL", nome:"Interface de climatização", valor:ICL, nota: climatDemandas.length===0?"Sem demandas de climatização registradas ainda.":null},
    {sigla:"BLC", nome:"Backlog corretivo", valor:BLC, unidade:"un.", invertido:true},
  ];
}

function salvarIndicadorOverride(sigla){
  const valor = document.getElementById("ovValor").value.trim();
  const nota = document.getElementById("ovNota").value.trim();
  if(!valor){ delete DATA.indicadoresOverride[sigla]; }
  else{ DATA.indicadoresOverride[sigla] = {valor, nota}; }
  saveData();
  closeModal();
  render();
}

function viewBacklog(){
  const itens = backlogItens();
  const porPrioridade = {P1:0,P2:0,P3:0,P4:0};
  itens.forEach(i=>{ porPrioridade[i.prioridade] = (porPrioridade[i.prioridade]||0)+1; });
  const vencidos = itens.filter(i=>i.vencido).length;
  const retrabalho = taxaRetrabalho();
  const ordenados = [...itens].sort((a,b)=>{
    if(a.vencido!==b.vencido) return a.vencido?-1:1;
    return (a.prioridade||"P4").localeCompare(b.prioridade||"P4");
  });
  return `
    <div class="topbar">
      <div>
        <h1 class="tab-title">Backlog</h1>
        <div class="tab-sub">Tudo que já foi solicitado e ainda não foi resolvido, com prioridade e prazo (SLA). Inclui os SGDs em aberto do Controle de Serviços, sincronizados ao vivo.</div>
      </div>
      <span class="badge ${csConectado?'b-feito':'b-pendente'}">${csConectado?'● Controle de Serviços conectado':'○ conectando ao Controle de Serviços…'}</span>

    <div class="grid-cards">
      <div class="stat"><div class="num">${itens.length}</div><div class="lab">total em aberto</div></div>
      <div class="stat st-red"><div class="num">${porPrioridade.P1}</div><div class="lab">P1 — emergencial</div></div>
      <div class="stat st-amber"><div class="num">${porPrioridade.P2}</div><div class="lab">P2 — alta</div></div>
      <div class="stat"><div class="num">${porPrioridade.P3}</div><div class="lab">P3 — normal</div></div>
      <div class="stat"><div class="num">${porPrioridade.P4}</div><div class="lab">P4 — programável</div></div>
      <div class="stat st-red"><div class="num">${vencidos}</div><div class="lab">vencidos (fora do SLA)</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Taxa de retrabalho (itens marcados "Não feito" sobre o total de registros)</h3></div>
      <div class="grid-cards" style="margin-bottom:0;">
        <div class="stat"><div class="num">${retrabalho.total}</div><div class="lab">registros no ciclo mensal</div></div>
        <div class="stat st-amber"><div class="num">${retrabalho.reaberturas}</div><div class="lab">marcados "não feito"</div></div>
        <div class="stat"><div class="num">${retrabalho.taxa}%</div><div class="lab">taxa</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Itens em aberto (${itens.length})</h3></div>
      ${itens.length===0 ? `<div class="empty">Nada em aberto no momento.</div>` :
      `<table><thead><tr><th>Origem</th><th>Unidade</th><th>Tipo</th><th>Equipe</th><th>Prioridade</th><th>Status</th></tr></thead>
      <tbody>${ordenados.map(i=>{
        const cls = {"Feito":"b-feito","Não feito":"b-nfeito","Parcial":"b-parcial","Pendente":"b-pendente","Em execução":"b-parcial"}[i.status]||"b-pendente";
        const nomeUnidade = i.unidadeNomeRaw || unidadeNome(i.unidadeId);
        return `<tr style="${i.vencido?'background:var(--red-soft);':''}">
          <td class="small-text">${i.tipo}${i.sgd?`<br><span class="small-text">SGD ${i.sgd}</span>`:""}</td><td>${nomeUnidade}</td><td>${i.tipoServico}</td><td>${nomeEquipe(i.equipeId)}${i.atribuidaManualmente?' <span class="small-text">(definida)</span>':''}</td>

/* ---------------- PAINEL ---------------- */
function viewPainel(){
  const due = DATA.planoItens.filter(it=>isDueInMonth(it, painelMes));
  let feitos=0, naoFeitos=0, parciais=0, pendentes=0;
  due.forEach(it=>{
    const c = getCiclo(it.id, painelMes);
    if(!c) pendentes++;
    else if(c.status==="Feito") feitos++;
    else if(c.status==="Não feito") naoFeitos++;
    else if(c.status==="Parcial") parciais++;
  });
  const pct = due.length ? Math.round((feitos/due.length)*100) : 0;

  const reagendados = DATA.ciclos.filter(c=>c.status==="Não feito" && c.replanejarPara===painelMes);

  return `
    <div class="topbar">
      <div>
        <h1 class="tab-title">Painel do mês</h1>
        <div class="tab-sub">Visão geral de ${fmtMes(painelMes)}</div>
      </div>
      <div class="month-picker">
        <button class="secondary icon-btn" onclick="painelMes=addMonths(painelMes,-1);render()">‹</button>
        <div class="cur">${fmtMes(painelMes)}</div>
        <button class="secondary icon-btn" onclick="painelMes=addMonths(painelMes,1);render()">›</button>
      </div>
    </div>

    ${DATA.unidades.length===0 ? `<div class="note-box">Cadastre as unidades de saúde e os itens do plano para começar a acompanhar o ciclo mensal.</div>` : ""}

    <div class="grid-cards">
      <div class="stat"><div class="num">${due.length}</div><div class="lab">itens previstos no mês</div></div>
      <div class="stat st-green"><div class="num">${feitos}</div><div class="lab">feitos</div></div>
      <div class="stat st-red"><div class="num">${naoFeitos}</div><div class="lab">não feitos</div></div>
      <div class="stat st-amber"><div class="num">${pendentes+parciais}</div><div class="lab">pendentes / parciais</div></div>
      <div class="stat"><div class="num">${pct}%</div><div class="lab">de conclusão do mês</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Itens pendentes de registro em ${fmtMes(painelMes)}</h3>
        <button class="secondary" onclick="setTab('ciclo')">Ir para o ciclo mensal</button>
      </div>
      ${renderPendentesTable(due, painelMes)}
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Reagendados para este mês</h3></div>
      ${reagendados.length===0 ? `<div class="empty">Nenhum item corretivo foi reagendado para ${fmtMes(painelMes)}.</div>` : `
      <table><thead><tr><th>Unidade</th><th>Tipo de serviço</th><th>Observação do replanejamento</th></tr></thead>
      <tbody>${reagendados.map(c=>{
        const item = DATA.planoItens.find(i=>i.id===c.planoItemId);
        if(!item) return "";
        return `<tr><td>${unidadeNome(item.unidadeId)}</td><td>${item.tipoServico}</td><td>${c.motivo?`<strong>${c.motivo}.</strong> `:""}${c.replanejarObs||"—"}</td></tr>`;
      }).join("")}</tbody></table>`}
    </div>
  `;
}
function renderPendentesTable(due, mesAno){
  const pend = due.filter(it=>{
    const c = getCiclo(it.id, mesAno);
    return !c || c.status==="Parcial";
  });
  if(pend.length===0) return `<div class="empty">Todos os itens previstos já foram registrados.</div>`;
  return `<table><thead><tr><th>Unidade</th><th>Tipo de serviço</th><th>Periodicidade</th><th>Status</th></tr></thead>
    <tbody>${pend.map(it=>{
      const c = getCiclo(it.id, mesAno);
      const status = c ? c.status : "Pendente";
      const cls = status==="Parcial"?"b-parcial":"b-pendente";
      return `<tr><td>${unidadeNome(it.unidadeId)}</td><td>${it.tipoServico}</td><td>${it.periodicidade}</td><td><span class="badge ${cls}">${status}</span></td></tr>`;
    }).join("")}</tbody></table>`;
}

  bg.classList.add("open");

let cicloFotosTmp = [];
let cicloFotoPathPrefix = "ciclos/temp";
function renderFotoThumbs(list, varName){
  if(!list.length) return `<div class="small-text">Nenhuma foto adicionada.</div>`;
  return list.map((f,i)=>`
    <div style="position:relative;">
      <img src="${f.url||f.dataUrl}" style="width:78px; height:78px; object-fit:cover; border-radius:6px; border:1px solid var(--line);">
      <button type="button" onclick="removerFotoDaLista(${varName}, ${i}, '${varName}')" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; padding:0; border-radius:50%; font-size:11px; line-height:1;">✕</button>
    </div>
  `).join("");
}
function removerFotoDaLista(lista, i, varName){
  const [removida] = lista.splice(i,1);
  if(removida && removida.path) removeFotoPm(removida.path);
  const previewEl = document.getElementById(varName==="albumFotosTmp" ? "albumFotosPreview" : "mFotosPreview");
  if(previewEl) previewEl.innerHTML = renderFotoThumbs(lista, varName);
}
async function handleCicloFotosInput(input){
  const files = Array.from(input.files || []);
  const preview = document.getElementById("mFotosPreview");
  for(const file of files){
    preview.innerHTML = renderFotoThumbs(cicloFotosTmp, "cicloFotosTmp") + `<div class="small-text">Enviando foto…</div>`;
    try{
      const blob = await resizeImageFile(file, 900);
      const foto = await uploadFotoPm(blob, cicloFotoPathPrefix);
      cicloFotosTmp.push(foto);
    }catch(e){ console.error("Falha ao processar/enviar foto", e); alert("Não foi possível enviar uma das fotos. Tente novamente."); }
  }
  preview.innerHTML = renderFotoThumbs(cicloFotosTmp, "cicloFotosTmp");
  input.value = "";
}
function toggleReplanCampo(){
  const s = document.getElementById("mStatus").value;
  document.getElementById("replanCampo").style.display = s==="Não feito" ? "block":"none";
}
function saveCiclo(planoItemId){
  const status = document.getElementById("mStatus").value;
  const dataExecucao = document.getElementById("mData").value;
  const observacao = document.getElementById("mObs").value.trim();
  let replanejarPara = null, replanejarObs = null, motivo = null;
  if(status==="Não feito"){
    replanejarPara = document.getElementById("mReplan").value || addMonths(cicloMes,1);
    motivo = document.getElementById("mMotivo").value;
    replanejarObs = document.getElementById("mReplanObs").value.trim();
  }
  let c = getCiclo(planoItemId, cicloMes);
  if(!c){
    c = {id:uid(), planoItemId, mesAno:cicloMes};
    DATA.ciclos.push(c);
  }
  c.status=status; c.dataExecucao=dataExecucao; c.observacao=observacao;
  c.replanejarPara=replanejarPara; c.motivo=motivo; c.replanejarObs=replanejarObs;
  c.fotos = cicloFotosTmp.slice();
  c.registradoEm = new Date().toISOString();
  saveData();
  closeModal();
  render();
}
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }

function importarUnidadesCoordSeed(){
  const existentes = new Set(DATA.unidades.map(u=>u.nome.trim().toUpperCase()));
  let adicionadas = 0, atualizadas = 0;
  UNIDADES_COORD_SEED.forEach(u=>{
    const chave = u.name.trim().toUpperCase();
    const existente = DATA.unidades.find(x=>x.nome.trim().toUpperCase()===chave);
    if(existente){
      if(!existente.lat){ Object.assign(existente, {lat:u.lat, lng:u.lng, endereco:u.endereco, rede:u.rede}); atualizadas++; }
    }else{
      DATA.unidades.push({id:uid(), nome:u.name, regional:u.regional||"", lat:u.lat, lng:u.lng, endereco:u.endereco||"", rede:u.rede||""});
      existentes.add(chave);
      adicionadas++;
    }
  });
  saveData();
  render();
  alert(adicionadas+" unidade(s) nova(s) importada(s) com coordenadas. "+atualizadas+" unidade(s) já existentes ganharam coordenadas.");
}
function normNome(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function tokenScore(a,b){
  const ta = new Set(normNome(a).split(" ").filter(t=>t.length>2));
  const tb = new Set(normNome(b).split(" ").filter(t=>t.length>2));
  if(ta.size===0||tb.size===0) return 0;
  let inter=0; ta.forEach(t=>{ if(tb.has(t)) inter++; });
  return inter / Math.min(ta.size, tb.size);
}
function importarClassificacaoAnexo1(){
  let matched=0; const unmatched=[];
  ANEXO1_CLASSIFICACAO.forEach(a=>{
    let best=null, bestScore=0;
    DATA.unidades.forEach(u=>{
      const score = tokenScore(a.nome, u.nome);
      if(score>bestScore){ bestScore=score; best=u; }
    });
    if(best && bestScore>=0.5){
      Object.assign(best, {perfil:a.perfil, classeCriticidade:a.classe, frequenciaBase:a.frequenciaBase, visitasAno:a.visitasAno, areaConstruida:a.areaConstruida, areaExterna:a.areaExterna, idAnexo:a.id});
      matched++;
    }else{
      unmatched.push(a.nome);
    }
  });
  saveData();
  render();
  alert(matched+" unidade(s) classificada(s) com perfil/criticidade do Anexo I."+(unmatched.length?"\n\n"+unmatched.length+" não encontraram correspondência clara e precisam ser conferidas/ajustadas manualmente:\n"+unmatched.slice(0,20).join("\n"):""));
}
function importarUnidadesSeed(){

}

let mapaLeafletInstance = null;
function initMapaLeaflet(){
  const el = document.getElementById("mapaLeaflet");
  if(!el || typeof L === "undefined") return;
  if(mapaLeafletInstance){ mapaLeafletInstance.remove(); mapaLeafletInstance = null; }
  mapaLeafletInstance = L.map("mapaLeaflet").setView([-15.601, -56.097], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(mapaLeafletInstance);
  const comCoord = DATA.unidades.filter(u=>u.lat && u.lng);
  const backlogPorUnidade = {};
  backlogItens().forEach(i=>{ backlogPorUnidade[i.unidadeId] = (backlogPorUnidade[i.unidadeId]||0)+(i.vencido?2:1); });
  const bounds = [];
  comCoord.forEach(u=>{
    const abertos = DATA.planoItens.filter(it=>it.unidadeId===u.id).length +
      DATA.demandas.filter(d=>d.unidadeId===u.id && d.status!=="Feito").length;
    const peso = backlogPorUnidade[u.id]||0;
    let cor = "#3F7D58", nivel = "estável";
    if(peso>=6){ cor="#B23A34"; nivel="crítica"; }
    else if(peso>=3){ cor="#B8722C"; nivel="atenção alta"; }
    else if(peso>=1){ cor="#C9A227"; nivel="atenção"; }
    const marker = L.circleMarker([u.lat, u.lng], {radius:9, color:cor, fillColor:cor, fillOpacity:0.85, weight:2}).addTo(mapaLeafletInstance);
    marker.bindPopup(`<b>${u.nome}</b><br>${u.regional||""}<br>${u.endereco||""}<br>${abertos} item(ns) no plano/pendentes<br>Situação: <b style="color:${cor}">${nivel}</b><br><a href="https://www.google.com/maps/search/?api=1&query=${u.lat},${u.lng}" target="_blank" rel="noopener">Abrir no Google Maps</a>`);
    bounds.push([u.lat, u.lng]);
  });
  const csComCoord = CS_REGISTROS.filter(r=>csRegistroAberto(r) && r.lat && r.lng);
  csComCoord.forEach(r=>{
    const marker = L.circleMarker([r.lat, r.lng], {radius:6, color:"#6B4FA0", fillColor:"#6B4FA0", fillOpacity:0.75, weight:1.5}).addTo(mapaLeafletInstance);
    marker.bindPopup(`<b>SGD ${r.sgd||""}</b><br>${r.local||""}<br>${(r.solicitacao||r.descricao||"").slice(0,140)}<br>Status: ${r.status}`);
  });
  if(bounds.length) mapaLeafletInstance.fitBounds(bounds, {padding:[30,30]});
}

function saveEquipe(id){

  const tiposServico = Array.from(document.querySelectorAll(".eTipoChk:checked")).map(c=>c.value);
  if(!nome){ alert("Informe o nome da equipe."); return; }
  if(id){

  }else{
    DATA.equipes.push({id:uid(), nome, integrantes, tiposServico});

function removeEquipe(id){

  DATA.equipes = DATA.equipes.filter(e=>e.id!==id);

  render();
}

/* ---------------- CALENDÁRIO ---------------- */
function eventosDoCalendario(mesAno){
  const eventos = {}; // "YYYY-MM-DD" -> [{tipo, label, unidadeId, prioridade}]
  function add(dia, ev){
    if(!dia) return;
    if(!eventos[dia]) eventos[dia] = [];
    eventos[dia].push(ev);
  }
  DATA.vistorias.filter(v=>(v.data||"").startsWith(mesAno)).forEach(v=>{
    add(v.data, {tipo:"Vistoria", label:"Vistoria — "+unidadeNome(v.unidadeId), unidadeId:v.unidadeId, prioridade:null});
  });
  DATA.demandas.filter(d=>d.dataAgendada && d.dataAgendada.startsWith(mesAno) && d.status!=="Feito").forEach(d=>{
    add(d.dataAgendada, {tipo:"Demanda agendada", label:d.tipoServico+" — "+unidadeNome(d.unidadeId), unidadeId:d.unidadeId, prioridade:d.prioridade, demandaId:d.id});
  });
  DATA.ciclos.filter(c=>c.dataExecucao && c.dataExecucao.startsWith(mesAno)).forEach(c=>{
    const it = DATA.planoItens.find(i=>i.id===c.planoItemId);
    if(!it) return;
    add(c.dataExecucao, {tipo:"Executado", label:it.tipoServico+" — "+unidadeNome(it.unidadeId), unidadeId:it.unidadeId, prioridade:it.prioridade});
  });
  return eventos;
}
function viewCalendario(){
  const [ano, mes] = calendarioMesAno.split("-").map(Number);
  const primeiroDia = new Date(ano, mes-1, 1);
  const ultimoDia = new Date(ano, mes, 0).getDate();
  const offset = primeiroDia.getDay(); // 0=domingo
  const eventos = eventosDoCalendario(calendarioMesAno);
  const hojeStr = new Date().toISOString().slice(0,10);
  let celulas = "";
  for(let i=0;i<offset;i++) celulas += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=ultimoDia; d++){
    const diaStr = calendarioMesAno+"-"+String(d).padStart(2,"0");
    const evs = eventos[diaStr]||[];
    const temP1 = evs.some(e=>e.prioridade==="P1");
    celulas += `<div class="cal-cell ${diaStr===hojeStr?'cal-hoje':''} ${diaStr===calendarioDiaSelecionado?'cal-selecionado':''}" onclick="calendarioDiaSelecionado='${diaStr}'; render();">
      <div class="cal-daynum">${d}</div>
      ${evs.length?`<div class="cal-badges">${evs.slice(0,3).map(e=>`<span class="cal-dot" style="background:${e.prioridade?PRIORIDADES[e.prioridade].cor:'var(--blue)'}"></span>`).join("")}${evs.length>3?`<span class="small-text">+${evs.length-3}</span>`:""}</div>`:""}
      ${temP1?`<div class="small-text" style="color:var(--red);">🔴</div>`:""}
    </div>`;
  }
  const diaSelEventos = calendarioDiaSelecionado ? (eventos[calendarioDiaSelecionado]||[]) : [];
  return `
    <div class="topbar">
      <div>
        <h1 class="tab-title">Calendário</h1>

        ${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="cal-cell cal-head">${d}</div>`).join("")}
      </div>
      <div class="cal-grid">${celulas}</div>
    </div>
    ${calendarioDiaSelecionado ? `
    <div class="panel">
      <div class="panel-head"><h3>${new Date(calendarioDiaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'})}</h3></div>

/* ---------------- CATÁLOGO DE ROTINAS (ANEXO VI) ---------------- */
function sistemaParaTipoServico(sistema, atividade){
  const s = (sistema||"").toLowerCase();
  const a = (atividade||"").toLowerCase();
  if(s.includes("cobertura")) return "Cobertura / Impermeabilização";
  if(s.includes("drenagem")||s.includes("esgotamento")||s.includes("hidráulica")||s.includes("hidraulica")||s.includes("reservação")||s.includes("reservacao")||s.includes("recalque")) return "Hidráulica";
  if(s.includes("elétrico")||s.includes("eletrico")) return "Elétrica";
  if(s.includes("climatização")||s.includes("climatizacao")) return "Ar-condicionado / Climatização";
  if(s.includes("estrutura")||s.includes("vedaç")||s.includes("vedac")) return a.includes("pintura") ? "Pintura" : "Alvenaria / Civil";
  if(s.includes("áreas externas")||s.includes("areas externas")) return "Limpeza de áreas externas";
  if(s.includes("segurança")||s.includes("seguranca")) return "Combate a incêndio";
  return "Outros";
}
function periodicidadeDoTexto(txt){
  const t = (txt||"").toLowerCase();
  const ordem = ["mensal","bimestral","trimestral","semestral","anual"];
  for(const p of ordem){ if(t.includes(p)) return p.charAt(0).toUpperCase()+p.slice(1); }
  return "Anual";
}
function rotinaAplicavelPerfil(perfilAplicavelStr, letra){
  if(!perfilAplicavelStr) return true;
  const s = perfilAplicavelStr.toUpperCase();
  if(s.includes("TODOS")) return true;
  if(!letra) return false;
  return s.split(",").map(x=>x.trim().charAt(0)).includes(letra);
}

/* ---------------- PLANEJAMENTO ---------------- */
function itensDoMesPorEquipe(mesAno){
  const grupos = {};
  DATA.equipes.forEach(e=>grupos[e.id]=[]);
  grupos["__sem_equipe__"] = [];

  DATA.planoItens.filter(it=>isDueInMonth(it, mesAno)).forEach(it=>{
    const c = getCiclo(it.id, mesAno);
    const status = c ? c.status : "Pendente";
    const eqId = equipeDoItem(it) || "__sem_equipe__";
    const prioridade = it.prioridade||"P4";
    grupos[eqId].push({tipo:"Plano recorrente", unidadeId:it.unidadeId, tipoServico:it.tipoServico, descricao:it.observacao||"", status, prioridade, criadoEm:it.criadoEm||null, vencido:isVencido(it.criadoEm, prioridade, status, it.unidadeId), origemId:it.id});
  });
  DATA.ciclos.filter(c=>c.status==="Não feito" && c.replanejarPara===mesAno).forEach(c=>{
    const it = DATA.planoItens.find(i=>i.id===c.planoItemId);
    if(!it) return;
    const eqId = equipeDoItem(it) || "__sem_equipe__";
    grupos[eqId].push({tipo:"Reagendado", unidadeId:it.unidadeId, tipoServico:it.tipoServico, descricao:(c.motivo?c.motivo+". ":"")+(c.replanejarObs||""), status:"Reagendado", prioridade:it.prioridade||"P4", criadoEm:null, vencido:false, origemId:it.id});
  });
  DATA.demandas.filter(d=>d.mesAlvo===mesAno).forEach(d=>{
    const eqId = d.equipeId || "__sem_equipe__";
    const prioridade = d.prioridade||"P2";
    grupos[eqId].push({tipo: d.origem==="Vistoria"?"Vistoria":d.origem==="Chamado"?"Chamado":d.origem==="Planejamento"?"Planejamento":"Demanda avulsa", unidadeId:d.unidadeId, tipoServico:d.tipoServico, descricao:d.descricao, status:d.status, prioridade, criadoEm:d.criadoEm, vencido:isVencido(d.criadoEm, prioridade, d.status, d.unidadeId), origemId:d.id, demandaId:d.id});
  });
  if(mesAno === curMesAno()){
    csItensAbertos().forEach(i=>{
      const eqId = i.equipeId || "__sem_equipe__";
      grupos[eqId].push(i);
    });
  }
  csItensFinalizadosNoMes(mesAno).forEach(i=>{
    const eqId = i.equipeId || "__sem_equipe__";
    grupos[eqId].push(i);
  });
  return grupos;
}
function statsEquipe(itens){
  const recebidos = itens.length;
  const executados = itens.filter(i=>i.status==="Feito").length;
  const pendentes = itens.filter(i=>i.status==="Pendente"||i.status==="Parcial").length;
  const reagendados = itens.filter(i=>i.status==="Reagendado").length;
  const vencidos = itens.filter(i=>i.vencido).length;
  const pct = recebidos ? Math.round(executados/recebidos*100) : 0;
  return {recebidos, executados, pendentes, reagendados, vencidos, pct};
}
/* ---------------- PLANEJAMENTO SEMANAL ---------------- */
function addDays(dataStr, n){
  const d = new Date(dataStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function itensDaSemanaPorEquipe(){
  const dias = [...Array(7)].map((_,i)=>addDays(semanaInicio,i));
  const grupos = {};
  DATA.equipes.forEach(e=>grupos[e.id]={});
  DATA.demandas.filter(d=>d.dataAgendada && dias.includes(d.dataAgendada) && d.status!=="Feito").forEach(d=>{
    const eqId = d.equipeId || "__sem_equipe__";
    if(!grupos[eqId]) grupos[eqId] = {};
    if(!grupos[eqId][d.dataAgendada]) grupos[eqId][d.dataAgendada] = [];
    grupos[eqId][d.dataAgendada].push({fonte:"demanda", id:d.id, unidadeId:d.unidadeId, tipoServico:d.tipoServico, prioridade:d.prioridade, descricao:d.descricao});
  });
  csItensAbertos().filter(i=>i.dataAgendada && dias.includes(i.dataAgendada)).forEach(i=>{
    const eqId = i.equipeId || "__sem_equipe__";
    if(!grupos[eqId]) grupos[eqId] = {};
    if(!grupos[eqId][i.dataAgendada]) grupos[eqId][i.dataAgendada] = [];
    grupos[eqId][i.dataAgendada].push({fonte:"cs", id:i.registroId, unidadeNomeRaw:i.unidadeNomeRaw, tipoServico:i.tipoServico, prioridade:i.prioridade, descricao:i.descricao, sgd:i.sgd});
  });
  return {dias, grupos};
}

        return `

                ${prioridadeBadge(d.prioridade)} ${d.fonte==='cs'?(d.unidadeNomeRaw||''):unidadeNome(d.unidadeId)}<br><span class="small-text">${d.tipoServico}${d.fonte==='cs'?' · SGD '+d.sgd:''}</span>

              <button type="button" class="ghost" style="width:100%; text-align:left; border:1px dashed var(--line); border-radius:5px; padding:4px 6px; font-size:11px; color:var(--ink-soft);" onclick="openAddServicoSemanal('${dia}','${e.id}')">+ Adicionar serviço</button>

const LIMITE_SERVICOS_POR_DIA = 5;
function itensDoDiaEquipe(dia, equipeId){
  const demandas = DATA.demandas.filter(d=>d.equipeId===equipeId && d.dataAgendada===dia && d.status!=="Feito");
  const csDoDia = csItensAbertos().filter(i=>i.equipeId===equipeId && i.dataAgendada===dia);
  return [...demandas, ...csDoDia];
}
let asFiltroTexto = "";
let asMostrarTodosTipos = false;
function backlogParaAgendar(equipeId){
  // backlog pendente do sistema (demandas + SGDs abertos do Controle de Serviços), filtrado pelos tipos de serviço da equipe
  const equipe = DATA.equipes.find(e=>e.id===equipeId);
  const tipos = equipe ? equipe.tiposServico : [];
  const combina = tipoServico => asMostrarTodosTipos || !tipos.length || tipos.includes(tipoServico);
  const demandas = DATA.demandas.filter(d=>d.status!=="Feito" && !d.dataAgendada && combina(d.tipoServico)).map(d=>({
    fonte:"demanda", id:d.id, unidadeLabel:unidadeNome(d.unidadeId), tipoServico:d.tipoServico,
    prioridade:d.prioridade||"P3", descricao:d.descricao, equipeAtual:d.equipeId
  }));
  const cs = csItensAbertos().filter(i=>!i.dataAgendada && combina(i.tipoServico)).map(i=>({
    fonte:"cs", id:i.registroId, unidadeLabel:i.unidadeNomeRaw, tipoServico:i.tipoServico,
    prioridade:i.prioridade, descricao:i.descricao+" (SGD "+i.sgd+")", equipeAtual:i.equipeId
  }));
  return [...demandas, ...cs];
}
function openAddServicoSemanal(dia, equipeId){
  const equipe = DATA.equipes.find(e=>e.id===equipeId);
  const jaNoDia = itensDoDiaEquipe(dia, equipeId).length;
  const vagas = LIMITE_SERVICOS_POR_DIA - jaNoDia;
  if(vagas<=0){
    alert(`Esse dia já tem ${LIMITE_SERVICOS_POR_DIA} serviços para ${equipe?equipe.nome:"essa equipe"} — o limite por dia. Remova algum ou escolha outro dia.`);
    return;
  }
  asFiltroTexto = "";
  asMostrarTodosTipos = false;
  renderAddServicoModal(dia, equipeId, vagas);
  document.getElementById("modalBg").classList.add("open");
}

function salvarServicoSemanal(dia, equipeId){
  const vagas = LIMITE_SERVICOS_POR_DIA - itensDoDiaEquipe(dia, equipeId).length;
  let adicionados = 0;

  const selecionadosChk = Array.from(document.querySelectorAll(".asExistenteChk:checked"));
  for(const chk of selecionadosChk){
    if(adicionados >= vagas) break;
    if(chk.dataset.fonte === "demanda"){
      const d = DATA.demandas.find(x=>x.id===chk.value);
      if(d){ d.dataAgendada = dia; d.equipeId = equipeId; adicionados++; }
    }else{
      DATA.csAgendamentos[chk.value] = dia;
      DATA.csAtribuicoes[chk.value] = equipeId;
      adicionados++;
    }
  }

  const unidadeId = document.getElementById("asUnidade") ? document.getElementById("asUnidade").value : "";
  const descricaoNova = document.getElementById("asDescricao") ? document.getElementById("asDescricao").value.trim() : "";
  if(unidadeId && descricaoNova){
    if(adicionados >= vagas){
      alert("Limite de "+LIMITE_SERVICOS_POR_DIA+" serviços no dia atingido — o serviço novo não foi criado. Remova algum ou escolha outro dia.");
    }else{
      const tipoServico = document.getElementById("asTipo").value;
      const prioridade = document.getElementById("asPrioridade").value;
      DATA.demandas.push({
        id: uid(), origem:"Planejamento", unidadeId, tipoServico, equipeId,
        prioridade, descricao: descricaoNova, mesAlvo: dia.slice(0,7),
        status:"Pendente", dataExecucao:null, observacao:"", motivo:null,
        criadoEm: new Date().toISOString(), dataAgendada: dia
      });
      adicionados++;
    }
  }

  if(adicionados===0){ alert("Selecione ao menos um serviço pendente ou preencha os campos de um serviço novo."); return; }
  saveData();
  closeModal();
  render();
}

/* ---------------- RELATÓRIO (CI) ---------------- */
function resumoMes(mesAno){
  const due = DATA.planoItens.filter(it=>isDueInMonth(it, mesAno));
  let feitos=0, naoFeitos=0, parciais=0, pendentes=0;
  due.forEach(it=>{
    const c = getCiclo(it.id, mesAno);
    if(!c) pendentes++;
    else if(c.status==="Feito") feitos++;
    else if(c.status==="Não feito") naoFeitos++;
    else if(c.status==="Parcial") parciais++;
  });
  return {total:due.length, feitos, naoFeitos, parciais, pendentes};
}

  const v = DATA.vistorias.find(x=>x.id===vistoriaId);
  if(!v) return;
  if(typeof docx === "undefined"){ alert("A biblioteca de geração de Word não carregou. Tente novamente em alguns segundos."); return; }
  const { Document, Packer, Paragraph, HeadingLevel, Table, TableRow, TableCell, TextRun, ImageRun, WidthType } = docx;

  const children = [
    new Paragraph({text:"PREFEITURA MUNICIPAL DE CUIABÁ", heading:HeadingLevel.HEADING_2}),
    new Paragraph({text:"Secretaria Municipal de Saúde — SMS"}),
    new Paragraph({text:"Coordenadoria Técnica de Obras, Serviços e Manutenções — CTOSM"}),
    new Paragraph({text:""}),
    new Paragraph({text:"RELATÓRIO DE VISTORIA", heading:HeadingLevel.HEADING_1}),
    new Paragraph({text:"Unidade: "+unidadeNome(v.unidadeId)}),
    new Paragraph({text:"Data: "+(v.data?v.data.split("-").reverse().join("/"):"—")}),
    new Paragraph({text:""}),
    new Paragraph({text:"Irregularidades encontradas", heading:HeadingLevel.HEADING_2}),
    new Paragraph({text:v.achados||"Nenhuma registrada."}),
    new Paragraph({text:"Resolvido no momento da vistoria", heading:HeadingLevel.HEADING_2}),
    new Paragraph({text:v.resolvidoNaHora||"—"}),
  ];

  if((v.checklist||[]).length){
    children.push(new Paragraph({text:"Checklist técnico", heading:HeadingLevel.HEADING_2}));
    const rows = [new TableRow({children:["Código","Elemento","Situação"].map(h=>new TableCell({width:{size:33,type:WidthType.PERCENTAGE}, children:[new Paragraph({children:[new TextRun({text:h,bold:true})]})]}))})];
    v.checklist.forEach(c=>{
      rows.push(new TableRow({children:[c.codigo, c.elemento, c.status].map(t=>new TableCell({width:{size:33,type:WidthType.PERCENTAGE}, children:[new Paragraph(String(t||""))]}))}));
    });
    children.push(new Table({rows, width:{size:100,type:WidthType.PERCENTAGE}}));
    children.push(new Paragraph({text:""}));
  }

  if((v.encaminhamentos||[]).length){
    children.push(new Paragraph({text:"Encaminhamentos para outras equipes", heading:HeadingLevel.HEADING_2}));
    const rows = [new TableRow({children:["Tipo de serviço","Equipe","Prioridade","Descrição"].map(h=>new TableCell({width:{size:25,type:WidthType.PERCENTAGE}, children:[new Paragraph({children:[new TextRun({text:h,bold:true})]})]}))})];
    v.encaminhamentos.forEach(en=>{
      rows.push(new TableRow({children:[en.tipoServico, nomeEquipe(en.equipeId), en.prioridade, en.descricao].map(t=>new TableCell({width:{size:25,type:WidthType.PERCENTAGE}, children:[new Paragraph(String(t||""))]}))}));
    });
    children.push(new Table({rows, width:{size:100,type:WidthType.PERCENTAGE}}));
    children.push(new Paragraph({text:""}));
  }

  if((v.fotos||[]).length){
    children.push(new Paragraph({text:"Memorial fotográfico", heading:HeadingLevel.HEADING_2}));
    for(const f of v.fotos){
      try{
        const resp = await fetch(f.url);
        const buf = await resp.arrayBuffer();
        children.push(new Paragraph({children:[new ImageRun({data:buf, transformation:{width:350, height:262}, type:"jpg"})]}));
        children.push(new Paragraph({text:""}));
      }catch(e){ console.error("Falha ao baixar foto para o Word:", e); }
    }
  }

  children.push(new Paragraph({text:""}));
  children.push(new Paragraph({text:"Equipe de Prevenção — assinatura: ___________________________________"}));

  const doc = new Document({sections:[{children}]});
  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "relatorio-vistoria-"+(v.data||"")+".docx";
  a.click();
  URL.revokeObjectURL(url);
}

function viewRelatorio(){
  const mesExec = relatorioMes;
  const mesPlan = addMonths(relatorioMes,1);
  const gruposExec = itensDoMesPorEquipe(mesExec);
  const gruposPlan = itensDoMesPorEquipe(mesPlan);
  const resumo = resumoMes(mesExec);
  const [anoExec, mesNumExec] = mesExec.split("-");
  const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const anoAtualReal = new Date().getFullYear();
  const anosDisponiveis = [];
  for(let a=2026; a<=anoAtualReal+3; a++) anosDisponiveis.push(a);

  const corpoEquipes = DATA.equipes.map(e=>{
    const execItens = (gruposExec[e.id]||[]).filter(i=>i.status==="Feito"||i.status==="Parcial"||i.status==="Em execução");
    const planItens = (gruposPlan[e.id]||[]);
    const obsKey = e.id+"|"+mesPlan;
    const obsPlan = DATA.planejamentoObs[obsKey]||"";
    return `
      <div class="ci-equipe">
        <h4>${e.nome} <span class="ci-integrantes">(${e.integrantes.join(", ")})</span></h4>
        <div class="ci-sub">Executado / em andamento em ${fmtMes(mesExec)}</div>
        ${execItens.length===0 ? `<p class="ci-empty">Nenhum item em andamento ou concluído neste mês.</p>` :
        `<table class="ci-table"><thead><tr><th>Unidade</th><th>Tipo</th><th>Prioridade</th><th>Descrição</th><th>Situação</th></tr></thead>
        <tbody>${execItens.map(i=>`<tr><td>${i.unidadeNomeRaw || unidadeNome(i.unidadeId)}</td><td>${i.tipoServico}</td><td>${i.prioridade||"P4"}</td><td>${i.descricao||"—"}</td><td>${i.status}</td></tr>`).join("")}</tbody></table>`}
        <div class="ci-sub">Planejado para ${fmtMes(mesPlan)}</div>
        ${planItens.length===0 ? `<p class="ci-empty">Nenhum item pendente para o próximo mês.</p>` :
        `<table class="ci-table"><thead><tr><th>Unidade</th><th>Tipo</th><th>Prioridade</th><th>Descrição</th></tr></thead>
        <tbody>${planItens.map(i=>`<tr><td>${i.unidadeNomeRaw || unidadeNome(i.unidadeId)}</td><td>${i.tipoServico}</td><td>${i.prioridade||"P4"}</td><td>${i.descricao||"—"}</td></tr>`).join("")}</tbody></table>`}
        ${obsPlan ? `<p class="ci-obs"><strong>Observações de planejamento:</strong> ${obsPlan}</p>` : ""}
      </div>
    `;
  }).join("");

  return `
    <div class="topbar">
      <div>
        <h1 class="tab-title">Relatório (CI)</h1>
        <div class="tab-sub">Documento de prestação de contas de ${fmtMes(mesExec)} e planejamento para ${fmtMes(mesPlan)}, por equipe.</div>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select onchange="relatorioMes = this.value+'-'+relatorioMes.split('-')[1]; render();">
          ${anosDisponiveis.map(a=>`<option value="${a}" ${String(a)===anoExec?"selected":""}>${a}</option>`).join("")}
        </select>
        <select onchange="relatorioMes = relatorioMes.split('-')[0]+'-'+this.value; render();">
          ${nomesMeses.map((n,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===mesNumExec?"selected":""}>${n}</option>`).join("")}
        </select>
        <button onclick="window.print()">Imprimir / Salvar PDF</button>
      </div>
    </div>

    <div class="ci-doc" id="ciDoc">
      <div class="ci-header">
        <img src="${LOGO_CUIABA}" alt="Prefeitura de Cuiabá" style="height:52px; flex-shrink:0;">
        <div class="ci-header-text">
          <div class="ci-orgao">PREFEITURA MUNICIPAL DE CUIABÁ</div>
          <div class="ci-secretaria">Secretaria Municipal de Saúde — SMS</div>
          <div class="ci-coord">Coordenadoria Técnica de Obras, Serviços e Manutenções — CTOSM</div>
        </div>
        <div class="ci-num">
          <div class="ci-num-label">COMUNICAÇÃO INTERNA</div>
          <div class="ci-num-value" style="display:flex; gap:4px; align-items:center; justify-content:flex-end;">
            CI nº <input type="text" value="${DATA.ciConfig.numero||""}" placeholder="____" style="width:55px; text-align:center; padding:2px 4px;" oninput="DATA.ciConfig.numero=this.value; saveData();">
            / <input type="text" value="${DATA.ciConfig.ano||anoAtualReal}" placeholder="____" style="width:55px; text-align:center; padding:2px 4px;" oninput="DATA.ciConfig.ano=this.value; saveData();">
          </div>
        </div>
      </div>
      <div class="ci-meta">
        <div><strong>Assunto:</strong> Relatório mensal do Plano de Manutenção Preventiva e Corretiva das Unidades de Saúde</div>
        <div><strong>Referência:</strong> Execução em ${fmtMes(mesExec)} · Planejamento para ${fmtMes(mesPlan)}</div>
      </div>

      <div class="ci-resumo">
        <div><strong>${resumo.total}</strong><span>itens previstos</span></div>
        <div><strong>${resumo.feitos}</strong><span>feitos</span></div>
        <div><strong>${resumo.naoFeitos}</strong><span>não feitos</span></div>
        <div><strong>${resumo.parciais+resumo.pendentes}</strong><span>pendentes/parciais</span></div>
        <div><strong>${resumo.total?Math.round(resumo.feitos/resumo.total*100):0}%</strong><span>de conclusão</span></div>
      </div>

      ${corpoEquipes}

      <div class="ci-legenda">
        <strong>Legenda de prioridade:</strong>
        ${Object.keys(PRIORIDADES).map(p=>`<span style="margin-right:14px;">${prioridadeBadge(p)} ${PRIORIDADES[p].label}</span>`).join("")}
      </div>

      <div class="ci-rodape">
        <div>Gerado pelo sistema de Plano de Manutenção — CTOSM/SMS Cuiabá, em ${new Date().toLocaleDateString('pt-BR')}.</div>
        <div class="ci-assinatura-final">
          ___________________________________<br>
          <input type="text" value="${DATA.ciConfig.gerente||""}" placeholder="Nome do(a) Gerente de Manutenção" oninput="DATA.ciConfig.gerente=this.value; saveData();" style="text-align:center; border:none; border-bottom:1px dotted var(--line); background:transparent; font-size:11.5px; width:220px;"><br>
          Gerente de Manutenção
        </div>
      </div>
    </div>
  `;
}

document.getElementById("sidebarLogo").src = LOGO_CUIABA;
initSupabaseSync();
</script>
</body>
